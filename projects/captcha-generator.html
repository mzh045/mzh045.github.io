<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码生成器</title>
    <style>
        :root { --primary-color:#4a90e2; --bg-color:#f0f2f5; --ok:#28a745; --bad:#dc3545; }
        * { box-sizing:border-box; }
        body {
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:var(--bg-color);
            display:flex; justify-content:center; align-items:flex-start;
            min-height:100vh; margin:0; padding:16px;
        }
        .container {
            background:white; padding:26px; border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            width:440px; max-width:calc(100vw - 24px);
        }
        h2 { margin:0 0 14px; color:#333; font-size:22px; }

        .row { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
        label { font-size:13px; color:#666; }
        input[type=text], input[type=number], select {
            padding:9px; border:1px solid #ddd; border-radius:8px;
            font-size:15px; outline:none; transition:border .3s; background:white;
        }
        input:focus, select:focus { border-color:var(--primary-color); }
        input[type=text] { flex:1; min-width:120px; }

        .canvas-wrapper {
            margin:14px 0; display:flex; justify-content:center; align-items:center;
            background:#eee; border-radius:8px; overflow:hidden;
            cursor:pointer; position:relative;
        }
        canvas { display:block; max-width:100%; height:auto; }

        .btn-group { display:flex; gap:8px; margin-bottom:10px; }
        button {
            flex:1; padding:11px; border:none; border-radius:8px;
            font-size:14px; cursor:pointer; font-weight:600;
            transition:all .2s; touch-action:manipulation; min-height:42px;
        }
        .btn-gen { background:var(--primary-color); color:white; }
        .btn-gen:hover { background:#357abd; }
        .btn-dl  { background:var(--ok); color:white; }
        .btn-dl:hover  { background:#218838; }
        .btn-cp  { background:#6f42c1; color:white; }
        .btn-cp:hover  { background:#5a32a3; }
        .btn-g   { background:#e9ecef; color:#666; }
        .btn-g:hover   { background:#dee2e6; }

        .tip { font-size:12px; color:#999; margin-top:12px; line-height:1.7; }

        #toast {
            position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
            background:rgba(40,50,60,.92); color:white; font-size:14px;
            padding:10px 18px; border-radius:8px; opacity:0;
            transition:opacity .3s; pointer-events:none; z-index:99;
        }
        #toast.show { opacity:1; }

        .hidden { display:none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 验证码生成器</h2>

    <div class="row" id="textRow">
        <input type="text" id="userInput" placeholder="输入内容，或点🎲随机生成" value="S8xK">
        <button class="btn-g" style="flex:none; padding:9px 13px;" onclick="randomText()" title="随机生成">🎲</button>
    </div>

    <div class="row">
        <label>风格</label>
        <select id="styleSelect" onchange="drawCaptcha()">
            <option value="classic">🌈 经典多彩 (Classic)</option>
            <option value="dark">🌙 暗黑霓虹 (Dark Neon)</option>
            <option value="sketch">✏️ 抽象素描 (Sketch)</option>
            <option value="flame">🔥 炽焰渐变 (Flame)</option>
            <option value="ice">🧊 冰蓝磨砂 (Ice)</option>
        </select>
    </div>

    <div class="row">
        <label>干扰</label>
        <select id="noiseSel" onchange="drawCaptcha()">
            <option value="0">无</option>
            <option value="1">轻度</option>
            <option value="2" selected>中度</option>
            <option value="3">重度</option>
        </select>
        <label>尺寸</label>
        <select id="sizeSel" onchange="applySize()">
            <option value="280x90">280×90</option>
            <option value="340x100" selected>340×100</option>
            <option value="420x120">420×120</option>
        </select>
        <label>扭曲</label>
        <select id="warpSel" onchange="drawCaptcha()">
            <option value="none">无</option>
            <option value="wave">波浪</option>
            <option value="tps" selected>薄板样条</option>
        </select>
    </div>

    <div class="canvas-wrapper" onclick="drawCaptcha()" title="点击刷新">
        <canvas id="captchaCanvas" width="340" height="100"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-gen" onclick="drawCaptcha()">刷新图片</button>
        <button class="btn-cp" onclick="copyImage()">复制</button>
        <button class="btn-dl" onclick="downloadImage()">下载 PNG</button>
    </div>

    <!--<div class="tip">纯前端生成，无数据上传</div>-->
    <div class="tip">
        · 5 种风格 × 4 档干扰 × 三种整体扭曲（无 / 波浪 / <b>薄板样条 TPS</b>，幅度均随干扰档位增强）；文本自动缩放居中，中英混排均可<br>
        · 字符形态：字体族 × 字重 × 斜体随机组合 + 基线正弦起伏 + 斜切 + 各向异性拉伸 + 混合角度分布<br>
        · 随机生成剔除易混淆字符（I O 0 1 l i）
    </div>
</div>

<div id="toast"></div>

<script>
    // ---------- 工具 ----------
    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
    }
    function randomColor(min, max) {
        return `rgb(${randomInt(min, max)},${randomInt(min, max)},${randomInt(min, max)})`;
    }
    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ---------- 随机生成（固定字符集：大写字母+数字，剔除易混淆的 I O 0 1） ----------
    const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    function randomText() {
        let s = '';
        for (let i = 0; i < 4; i++) s += CHARS[randomInt(0, CHARS.length - 1)];
        document.getElementById('userInput').value = s;
        drawCaptcha();
    }

    function applySize() {
        const [w, h] = document.getElementById('sizeSel').value.split('x').map(Number);
        const c = document.getElementById('captchaCanvas');
        c.width = w; c.height = h;
        drawCaptcha();
    }

    // ---------- 干扰档位 ----------
    function noiseLevel() {
        return {
            0: { noise: 0,   lines: 0, rot: 0  },
            1: { noise: 60,  lines: 3, rot: 18 },
            2: { noise: 130, lines: 5, rot: 30 },
            3: { noise: 240, lines: 9, rot: 42 },
        }[document.getElementById('noiseSel').value];
    }

    // ---------- 核心绘制 ----------
    const LATIN_FONTS = ['Arial', 'Verdana', 'Georgia', 'Times New Roman', 'Courier New',
                         'Comic Sans MS', 'Impact', 'Trebuchet MS', 'Palatino Linotype',
                         'Consolas', 'Cambria', 'Segoe UI', 'Tahoma',
                         'serif', 'cursive', 'monospace', 'fantasy'];
    const CJK_FONTS = ['Microsoft YaHei', 'SimHei', 'KaiTi', 'FangSong', 'YouYuan',
                       'STKaiti', 'STXingkai', 'PingFang SC', 'Noto Sans SC'];
    const isCJK = ch => /[一-鿿]/.test(ch);
    // 每字符随机组合：字体族 × 字重 × 斜体
    function fontString(size, ch) {
        const pool = isCJK(ch) ? CJK_FONTS : LATIN_FONTS;
        const family = pool[randomInt(0, pool.length - 1)];
        const style = Math.random() < 0.25 ? 'italic ' : '';
        const weight = Math.random() < 0.5 ? 'bold' : '900';
        return `${style}${weight} ${size}px ${family}`;
    }

    function displayText() {
        return document.getElementById('userInput').value || 'ABCD';
    }

    function drawCaptcha() {
        const text = displayText();
        const styleType = document.getElementById('styleSelect').value;
        const lv = noiseLevel();
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // --- 1. 背景 ---
        if (styleType === 'dark') {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, w, h);
        } else if (styleType === 'sketch') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
            for (let i = 0; i < w; i += 20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
            for (let i = 0; i < h; i += 20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
        } else if (styleType === 'flame') {
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#2b1408'); g.addColorStop(1, '#120906');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        } else if (styleType === 'ice') {
            const g = ctx.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, '#eef7ff'); g.addColorStop(1, '#d3e9fa');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        } else {
            const gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, randomColor(240, 255));
            gradient.addColorStop(1, randomColor(220, 240));
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);
        }

        // --- 2. 噪点与干扰线 ---
        for (let i = 0; i < lv.noise; i++) {
            ctx.fillStyle = styleType === 'dark' ? randomColor(100, 200)
                          : styleType === 'flame' ? `rgba(255,${randomInt(80, 190)},30,.8)`
                          : styleType === 'ice'   ? `rgba(${randomInt(140, 190)},${randomInt(180, 220)},255,.8)`
                          : randomColor(150, 220);
            ctx.beginPath();
            ctx.arc(randomInt(0, w), randomInt(0, h), randomInt(1, 2), 0, 2 * Math.PI);
            ctx.fill();
        }
        for (let i = 0; i < lv.lines; i++) {
            ctx.strokeStyle = styleType === 'dark' ? randomColor(50, 150)
                            : styleType === 'flame' ? `rgba(255,${randomInt(60, 150)},20,.7)`
                            : styleType === 'ice'   ? `rgba(${randomInt(90, 150)},${randomInt(150, 200)},240,.8)`
                            : randomColor(180, 230);
            ctx.lineWidth = randomInt(1, 3);
            ctx.beginPath();
            ctx.moveTo(randomInt(0, w / 4), randomInt(0, h));
            ctx.bezierCurveTo(
                randomInt(w / 4, w / 2), randomInt(0, h),
                randomInt(w / 2, 3 * w / 4), randomInt(0, h),
                randomInt(3 * w / 4, w), randomInt(0, h)
            );
            ctx.stroke();
        }

        // --- 3. 文字（真实测量自适应 + 逐字旋转） ---
        function layoutChars(size) {
            ctx.textBaseline = 'middle';
            const items = []; let total = 0;
            for (const ch of text) {
                ctx.font = fontString(size, ch);
                const cw = ctx.measureText(ch).width;
                items.push({ ch, font: ctx.font, width: cw });
                total += cw;
            }
            return { items, total };
        }
        const spacing = 6, n = [...text].length || 1;
        let fontSize = Math.max(14, Math.min(46, Math.floor((w - 40) / n / 0.65)));
        let layout;
        while (true) {
            layout = layoutChars(fontSize);
            const tw = layout.total + spacing * (layout.items.length - 1);
            if (tw <= w - 40 || fontSize <= 14) break;
            fontSize -= 2;
        }
        let x = (w - (layout.total + spacing * (layout.items.length - 1))) / 2;

        // 炽焰文字渐变（横向跨画布）
        const flameGrad = ctx.createLinearGradient(0, 0, w, 0);
        flameGrad.addColorStop(0, '#ffe97a'); flameGrad.addColorStop(.5, '#ff9a3c'); flameGrad.addColorStop(1, '#ff4d2e');
        const iceGrad = ctx.createLinearGradient(0, 0, 0, h);
        iceGrad.addColorStop(0, '#8fc3e8'); iceGrad.addColorStop(1, '#3c6e9f');

        const maxAngle = layout.items.length > 8 ? Math.min(15, lv.rot) : lv.rot;
        const basePhase = Math.random() * Math.PI * 2;   // 基线波相位
        for (let i = 0; i < layout.items.length; i++) {
            const c = layout.items[i];
            ctx.save();
            ctx.font = c.font;
            ctx.textBaseline = 'middle';

            if (styleType === 'dark') {
                ctx.fillStyle = randomColor(180, 255);
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
            } else if (styleType === 'flame') {
                ctx.fillStyle = flameGrad;
                ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 12;
            } else if (styleType === 'ice') {
                ctx.fillStyle = iceGrad; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                ctx.shadowColor = 'rgba(120,180,230,.9)'; ctx.shadowBlur = 6;
            } else if (styleType === 'sketch') {
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0)';
            } else {
                ctx.fillStyle = randomColor(50, 160);
                ctx.shadowColor = 'rgba(0,0,0,0.1)'; ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            }

            // 基线正弦波动（字符上下起伏）
            const baseY = h / 2 + Math.sin(i * 0.9 + basePhase) * h * 0.08;
            ctx.translate(x + c.width / 2, baseY);
            // 角度混合分布：70% 小角度（±0.6 倍），30% 全幅 ±maxAngle
            const rmix = Math.random() < 0.7 ? (Math.random() * 1.2 - 0.6) : (Math.random() * 2 - 1);
            const angle = (lv.rot ? rmix * maxAngle : 0) * Math.PI / 180;
            // 斜切（伪斜体加剧）+ 各向异性缩放（宽高独立拉伸）
            const shearX = (Math.random() * 0.5 - 0.25) * (lv.rot ? 1 : 0);
            const shearY = (Math.random() * 0.24 - 0.12) * (lv.rot ? 1 : 0);
            const sx = 1 + (Math.random() * 0.3 - 0.15) * (lv.rot ? 1 : 0);
            const sy = 1 + (Math.random() * 0.3 - 0.15) * (lv.rot ? 1 : 0);
            ctx.transform(1, shearY, shearX, 1, 0, 0);
            ctx.rotate(angle);
            ctx.scale(sx, sy);

            if (styleType === 'sketch') {
                ctx.strokeText(c.ch, -c.width / 2, 0);
                ctx.beginPath();
                ctx.moveTo(-10, randomInt(-10, 10));
                ctx.lineTo(10, randomInt(-10, 10));
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.stroke();
            } else if (styleType === 'ice') {
                ctx.strokeText(c.ch, -c.width / 2, 0);
                ctx.fillText(c.ch, -c.width / 2, 0);
            } else {
                ctx.fillText(c.ch, -c.width / 2, 0);
            }
            ctx.restore();
            x += c.width + spacing;
        }

        // --- 4. 整体扭曲：波浪 / 薄板样条（幅度均随干扰档位增强） ---
        const warp = document.getElementById('warpSel').value;
        const lvN = +document.getElementById('noiseSel').value;
        if (warp === 'wave') waveWarp(ctx, w, h, h * (0.012 + 0.01 * lvN));
        else if (warp === 'tps') tpsWarp(ctx, w, h);
    }

    function waveWarp(ctx, w, h, amp) {
        const src = ctx.getImageData(0, 0, w, h), out = ctx.createImageData(w, h);
        const sd = src.data, od = out.data;
        const p1 = Math.random() * Math.PI * 2, p2 = Math.random() * Math.PI * 2;
        for (let y = 0; y < h; y++) {
            const dy = amp * Math.sin(y * 0.13 + p1);
            for (let x = 0; x < w; x++) {
                const sx = Math.min(w - 1, Math.max(0, Math.round(x + dy)));
                const sy = Math.min(h - 1, Math.max(0, Math.round(y + amp * Math.sin(x * 0.11 + p2))));
                const si = (sy * w + sx) * 4, di = (y * w + x) * 4;
                od[di] = sd[si]; od[di + 1] = sd[si + 1]; od[di + 2] = sd[si + 2]; od[di + 3] = 255;
            }
        }
        ctx.putImageData(out, 0, 0);
    }

    // ---------- 薄板样条（TPS）扭曲 ----------
    function solveLinear(A, b) {          // 通用 n×n 高斯消元（原地），失败返回 null
        const n = A.length;
        for (let col = 0; col < n; col++) {
            let piv = col;
            for (let r = col + 1; r < n; r++)
                if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) piv = r;
            if (Math.abs(A[piv][col]) < 1e-12) return null;
            [A[col], A[piv]] = [A[piv], A[col]];
            [b[col], b[piv]] = [b[piv], b[col]];
            for (let r = col + 1; r < n; r++) {
                const f = A[r][col] / A[col][col];
                for (let c = col; c < n; c++) A[r][c] -= f * A[col][c];
                b[r] -= f * b[col];
            }
        }
        const x = new Array(n);
        for (let r = n - 1; r >= 0; r--) {
            let s = b[r];
            for (let c = r + 1; c < n; c++) s -= A[r][c] * x[c];
            x[r] = s / A[r][r];
        }
        return x;
    }

    function tpsWarp(ctx, w, h) {
        const lv = +document.getElementById('noiseSel').value;        // 0..3
        const amp = h * (0.05 + 0.028 * lv);                          // 扭曲幅度随干扰档位
        // 控制点网格：边界点位移为 0（防止内容被推出画布），内部点随机位移
        const cols = 6, rows = 5, pts = [];
        for (let j = 0; j < rows; j++)
            for (let i = 0; i < cols; i++) {
                const border = (i === 0 || i === cols - 1 || j === 0 || j === rows - 1);
                pts.push({
                    x: w * i / (cols - 1), y: h * j / (rows - 1),
                    dx: border ? 0 : (Math.random() * 2 - 1) * amp,
                    dy: border ? 0 : (Math.random() * 2 - 1) * amp
                });
            }
        const K = pts.length, n = K + 3, LAM = 0.01;                  // 微正则化保平滑
        const U = r2 => r2 > 0 ? 0.5 * r2 * Math.log(r2) : 0;         // 核函数 r²·log(r)
        // 组装 (K+3)×(K+3)：[ U+λI  Q ; Qᵀ  0 ]
        const M = Array.from({ length: n }, () => new Array(n).fill(0));
        for (let i = 0; i < K; i++) {
            for (let j = 0; j < K; j++)
                M[i][j] = U((pts[i].x - pts[j].x) ** 2 + (pts[i].y - pts[j].y) ** 2)
                          + (i === j ? LAM : 0);
            M[i][K] = 1; M[i][K + 1] = pts[i].x; M[i][K + 2] = pts[i].y;
            M[K][i] = 1; M[K + 1][i] = pts[i].x; M[K + 2][i] = pts[i].y;
        }
        const bx = pts.map(p => p.dx).concat([0, 0, 0]);
        const by = pts.map(p => p.dy).concat([0, 0, 0]);
        const wx = solveLinear(M.map(r => r.slice()), bx);            // x 位移场系数
        const wy = solveLinear(M.map(r => r.slice()), by);            // y 位移场系数
        if (!wx || !wy) return;
        const disp = (px, py, wv) => {                                // TPS 求值：仿射 + Σw·U
            let s = wv[K] + wv[K + 1] * px + wv[K + 2] * py;
            for (let j = 0; j < K; j++) {
                const dx = px - pts[j].x, dy = py - pts[j].y;
                s += wv[j] * U(dx * dx + dy * dy);
            }
            return s;
        };
        // 反向映射 + 双线性采样
        const src = ctx.getImageData(0, 0, w, h), out = ctx.createImageData(w, h);
        const sd = src.data, od = out.data;
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const u = x + disp(x, y, wx), v = y + disp(x, y, wy);
                const di = (y * w + x) * 4;
                if (u < 0 || v < 0 || u >= w - 1 || v >= h - 1) {
                    od[di] = od[di + 1] = od[di + 2] = 255; od[di + 3] = 255;
                    continue;
                }
                const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0;
                const i00 = (y0 * w + x0) * 4, i10 = i00 + 4, i01 = i00 + w * 4, i11 = i01 + 4;
                for (let c = 0; c < 3; c++) {
                    const t = sd[i00 + c] * (1 - fx) + sd[i10 + c] * fx;
                    const b2 = sd[i01 + c] * (1 - fx) + sd[i11 + c] * fx;
                    od[di + c] = t * (1 - fy) + b2 * fy;
                }
                od[di + 3] = 255;
            }
        }
        ctx.putImageData(out, 0, 0);
    }

    // ---------- 导出 ----------
    function canvas() { return document.getElementById('captchaCanvas'); }
    function downloadImage() {
        const a = document.createElement('a');
        a.download = `captcha_${Date.now()}.png`;
        a.href = canvas().toDataURL('image/png');
        a.click();
    }
    function copyImage() {
        canvas().toBlob(async b => {
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
                toast('✅ 已复制到剪贴板');
            } catch (e) { toast('❌ 复制失败（浏览器限制）'); }
        });
    }

    // ---------- 初始化 ----------
    window.onload = drawCaptcha;
</script>

</body>
</html>
