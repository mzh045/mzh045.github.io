<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码生成器</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f0f2f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 400px;
            max-width: calc(100vw - 24px);
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; font-size: 22px; margin-bottom: 20px;}
        
        .control-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 14px; color: #666; display: block; margin-bottom: 5px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus { border-color: var(--primary-color); }

        .canvas-wrapper {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee; /* 占位背景 */
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        canvas { display: block; max-width: 100%; height: auto; }
        
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-gen { background-color: var(--primary-color); color: white; }
        .btn-gen:hover { background-color: #357abd; }
        .btn-dl { background-color: #28a745; color: white; }
        .btn-dl:hover { background-color: #218838; }

        .tip { font-size: 12px; color: #999; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 验证码生成器</h2>
    
    <div class="control-group">
        <label>验证码内容</label>
        <input type="text" id="userInput" placeholder="输入中文/字母/数字" value="S8xK">
    </div>

    <div class="control-group">
        <label>选择风格</label>
        <select id="styleSelect" onchange="drawCaptcha()">
            <option value="classic">🌈 经典多彩 (Classic)</option>
            <option value="dark">🌙 暗黑霓虹 (Dark Neon)</option>
            <option value="sketch">✏️ 抽象素描 (Sketch)</option>
        </select>
    </div>

    <div class="canvas-wrapper" onclick="drawCaptcha()" title="点击刷新">
        <canvas id="captchaCanvas" width="340" height="90"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-gen" onclick="drawCaptcha()">刷新图片</button>
        <button class="btn-dl" onclick="downloadImage()">下载图片</button>
    </div>
    <!--<div class="tip">纯前端生成，无数据上传</div>-->
</div>

<script>
    // 工具函数：生成随机整数
    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
    }

    // 工具函数：生成随机颜色
    function randomColor(min, max) {
        let r = randomInt(min, max);
        let g = randomInt(min, max);
        let b = randomInt(min, max);
        return `rgb(${r},${g},${b})`;
    }

    // 核心绘制函数
    function drawCaptcha() {
        const text = document.getElementById('userInput').value || "ABCD";
        const styleType = document.getElementById('styleSelect').value;
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        // 清空画布
        ctx.clearRect(0, 0, w, h);

        // --- 1. 绘制背景 ---
        if (styleType === 'dark') {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, w, h);
        } else if (styleType === 'sketch') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            // 素描风格加一点网格
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i=0; i<w; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            for(let i=0; i<h; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }
        } else {
            // 经典风格：浅色渐变背景
            let gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, randomColor(240, 255));
            gradient.addColorStop(1, randomColor(220, 240));
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);
        }

        // --- 2. 绘制干扰元素 (噪点与线条) ---
        // 噪点
        const noiseCount = styleType === 'sketch' ? 30 : 80;
        for (let i = 0; i < noiseCount; i++) {
            ctx.fillStyle = styleType === 'dark' ? randomColor(100, 200) : randomColor(150, 220);
            ctx.beginPath();
            ctx.arc(randomInt(0, w), randomInt(0, h), randomInt(1, 2), 0, 2 * Math.PI);
            ctx.fill();
        }

        // 干扰线 (贝塞尔曲线)
        const lineCount = styleType === 'sketch' ? 3 : 5;
        for (let i = 0; i < lineCount; i++) {
            ctx.strokeStyle = styleType === 'dark' ? randomColor(50, 150) : randomColor(180, 230);
            ctx.lineWidth = randomInt(1, 3);
            ctx.beginPath();
            ctx.moveTo(randomInt(0, w/4), randomInt(0, h));
            // 两个控制点，形成波浪
            ctx.bezierCurveTo(
                randomInt(w/4, w/2), randomInt(0, h),
                randomInt(w/2, 3*w/4), randomInt(0, h),
                randomInt(3*w/4, w), randomInt(0, h)
            );
            ctx.stroke();
        }

        // --- 3. 绘制文字 (核心) ---
        // 字体池
        const fonts = ['Arial', 'Verdana', 'Georgia', 'Times New Roman', 'Courier New'];

        // 按给定字号逐字测量真实宽度（中英文混排都准确）
        function layoutChars(size) {
            ctx.textBaseline = 'middle';
            const items = [];
            let total = 0;
            for (const ch of text) {
                const fontName = fonts[randomInt(0, fonts.length - 1)];
                ctx.font = `bold ${size}px ${fontName}`;
                const cw = ctx.measureText(ch).width;
                items.push({ ch, font: ctx.font, width: cw });
                total += cw;
            }
            return { items, total };
        }

        // 自动缩放：字号从大到小逐级减，直到整串文字装进画布（左右各留 20px）
        const spacing = 6;
        const numChars = [...text].length || 1;
        let fontSize = Math.max(14, Math.min(46, Math.floor((w - 40) / numChars / 0.65)));
        let layout;
        while (true) {
            layout = layoutChars(fontSize);
            const totalWidth = layout.total + spacing * (layout.items.length - 1);
            if (totalWidth <= w - 40 || fontSize <= 14) break;
            fontSize -= 2;
        }
        let x = (w - (layout.total + spacing * (layout.items.length - 1))) / 2;

        for (let i = 0; i < layout.items.length; i++) {
            const c = layout.items[i];
            ctx.save();

            // 字体样式（沿用测量时的字体与字号，保证宽度一致）
            ctx.font = c.font;
            ctx.textBaseline = 'middle';

            // 颜色设置
            if (styleType === 'dark') {
                ctx.fillStyle = randomColor(180, 255); // 亮色文字
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10; // 霓虹发光效果
            } else if (styleType === 'sketch') {
                ctx.strokeStyle = '#333'; // 空心文字
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0)'; // 透明填充
            } else {
                ctx.fillStyle = randomColor(50, 160); // 经典深色文字
                ctx.shadowColor = "rgba(0,0,0,0.1)";
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
            }

            // 坐标变换：平移到字符中心 -> 旋转 -> 缩放
            ctx.translate(x + c.width / 2, h / 2);

            // 随机旋转（长文本用小角度，避免上下出界）
            const maxAngle = layout.items.length > 8 ? 15 : 30;
            const angle = randomInt(-maxAngle, maxAngle) * Math.PI / 180;
            ctx.rotate(angle);

            // 随机轻微缩放
            const scale = 1 + Math.random() * 0.2;
            ctx.scale(scale, scale);

            // 绘制（以字符中心为原点）
            if (styleType === 'sketch') {
                ctx.strokeText(c.ch, -c.width / 2, 0);
                // 素描风再加一点乱画的线条在文字上
                ctx.beginPath();
                ctx.moveTo(-10, randomInt(-10, 10));
                ctx.lineTo(10, randomInt(-10, 10));
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.stroke();
            } else {
                ctx.fillText(c.ch, -c.width / 2, 0);
            }

            ctx.restore();
            x += c.width + spacing;
        }

        // --- 4. 前景干扰 (可选，增加难度) ---
        if (styleType !== 'sketch') {
            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = styleType === 'dark' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(randomInt(0, w), randomInt(0, h));
                ctx.lineTo(randomInt(0, w), randomInt(0, h));
                ctx.stroke();
            }
        }
    }

    // 下载图片功能
    function downloadImage() {
        const canvas = document.getElementById('captchaCanvas');
        // 将 Canvas 内容转为 Data URL
        const image = canvas.toDataURL("image/png");
        
        // 创建临时链接下载
        const link = document.createElement('a');
        link.download = `verificode_${new Date().getTime()}.png`;
        link.href = image;
        link.click();
    }

    // 初始化
    window.onload = drawCaptcha;
</script>

</body>
</html>
